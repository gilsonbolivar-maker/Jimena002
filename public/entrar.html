<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f6a">
<title>Entrar — Jimena Andrade</title>
<link rel="stylesheet" href="estilo.css?v=1.4.0">
<style>
  .tela { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  .caixa { width: 100%; max-width: 380px; }
  .logo { text-align: center; margin-bottom: 18px; }
  .logo .circ { width: 64px; height: 64px; margin: 0 auto 10px; border-radius: 50%; background: var(--marca); color: #fff; display: grid; place-items: center; font-size: 26px; font-weight: 800; }
  .logo b { display: block; font-size: 22px; }
  .logo small { color: var(--suave); }
  form > * + * { margin-top: 10px; }
  .teste { margin-top: 18px; border-top: 1px dashed var(--linha); padding-top: 14px; }
  .teste p { font-size: 13px; color: var(--suave); margin: 0 0 8px; }
  .teste .linha2 .btn { width: 100%; }
</style>
</head>
<body>
<div class="tela">
  <div class="caixa">
    <div class="logo">
      <div class="circ">JA</div>
      <b data-clinica></b>
      <small data-subtitulo></small>
    </div>
    <div class="cartao">
      <form id="form">
        <input type="email" id="email" placeholder="E-mail" autocomplete="username" required>
        <input type="password" id="senha" placeholder="Senha" autocomplete="current-password" required>
        <button class="btn grande" id="entrar">Entrar</button>
      </form>
      <p class="dica centro">Esta entrada é só para a equipe. <a href="cliente.html">Sou paciente</a></p>
      <div class="teste">
        <p>Contas de teste (temporário, só com pacientes fictícios):</p>
        <div class="linha2">
          <button class="btn sec" data-teste="assistente@teste.clinica">Assistente</button>
          <button class="btn sec" data-teste="jimena@teste.clinica">Jimena</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=1.4.0"></script>
<script src="comum.js?v=1.4.0"></script>
<script>
async function irPara() {
  const { data } = await sb.auth.getSession();
  if (!data.session) return;
  const email = data.session.user.email.toLowerCase();
  const { data: eq } = await sb.from("clinica_equipe").select("papel").eq("email", email).maybeSingle();
  if (!eq) { await sb.auth.signOut(); aviso("Este acesso não faz parte da equipe.", "erro"); return; }
  const volta = new URLSearchParams(location.search).get("volta");
  location.href = volta || (eq.papel === "dentista" ? "agenda.html" : "assistente.html");
}
async function entrar(email, senha) {
  $("#entrar").disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email, password: senha });
  $("#entrar").disabled = false;
  if (error) { aviso("E-mail ou senha incorretos.", "erro"); return; }
  irPara();
}
$("#form").addEventListener("submit", (e) => { e.preventDefault(); entrar($("#email").value.trim(), $("#senha").value); });
$$("[data-teste]").forEach((b) => b.addEventListener("click", () => entrar(b.dataset.teste, "clinica2026")));
irPara();
</script>
</body>
</html>
